name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build logo image assets
        run: |
          cat assets/law-logos.b64.part1 assets/law-logos.b64.part2 assets/law-logos.b64.part3 assets/law-logos.b64.part4 assets/law-logos.b64.part5 | base64 --decode > assets/law-logos.jpg
          cat assets/law-hq.b64.part1 assets/law-hq.b64.part2 assets/law-hq.b64.part3 | base64 --decode > assets/law-logos-hq.webp
          file assets/law-logos.jpg
          file assets/law-logos-hq.webp
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
